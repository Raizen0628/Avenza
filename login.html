<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Avenza – Log in</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section id="login" class="on auth flip" aria-label="Log in">

    <!-- Log in form -->
    <form novalidate data-form="login">

      <div class="av">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4.5" />
          <path d="M3.5 21c.6-4.6 4-7 8.5-7s7.9 2.4 8.5 7z" />
        </svg>
      </div>

      <h1>Log in</h1>

      <div class="f">
        <label for="u">Email</label>
        <input
          id="u"
          type="text"
          name="user"
          autocomplete="username"
          placeholder="you@school.edu.ph"
          required>
      </div>

      <div class="f">
        <label for="lp">Password</label>
        <input
          id="lp"
          type="password"
          name="pw"
          autocomplete="current-password"
          placeholder="Password"
          required>
      </div>

      <!-- 2-step verification code (shown only when needed) -->
      <div class="f" id="mfaBox" style="display:none">
        <label for="code">Authenticator code</label>
        <input
          id="code"
          type="text"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          placeholder="6-digit code">
      </div>

      <div class="row">
        <label>
          <input type="checkbox"> Remember me
        </label>
        <a data-go="forgot" tabindex="0" role="link">Forgot password?</a>
      </div>

      <p class="err" role="alert"></p>

      <button type="submit">Log in</button>
      <button type="button" class="alt" data-go="signup">Create an account</button>

      <button type="button" class="g" data-go="google">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335"
            d="M24 9.5c3.5 0 6.6 1.2 9.1 3.5l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z" />
          <path fill="#4285F4"
            d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z" />
          <path fill="#FBBC05"
            d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z" />
          <path fill="#34A853"
            d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z" />
        </svg>
        Continue with Google
      </button>

    </form>

    <!-- Welcome panel -->
    <div class="panel">
      <img class="logo" alt="Avenza" src="logo.png">
      <h2>Welcome back!</h2>
    </div>

  </section>

  <div class="ok" id="toast" role="status"></div>

  <script src="script.js"></script>
  <script type="module" src="auth.js"></script>
</body>

</html>
