<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Avenza – Sign Up</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sign Up Section -->
    <section id="signup" class="auth on" aria-label="Sign up">

        <form novalidate data-form="signup">

            <!-- User Icon -->
            <div class="av">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="8" r="4.5"/>
                    <path d="M3.5 21c.6-4.6 4-7 8.5-7s7.9 2.4 8.5 7z"/>
                </svg>
            </div>

            <h1>Sign up</h1>

            <!-- Full Name -->
            <div class="f">
                <label for="n">Full name</label>
                <input
                    id="n"
                    type="text"
                    name="name"
                    autocomplete="name"
                    placeholder="Full name"
                    required
                >
            </div>

            <!-- Email -->
            <div class="f">
                <label for="e">Email</label>
                <input
                    id="e"
                    type="email"
                    name="email"
                    autocomplete="email"
                    placeholder="you@school.edu.ph"
                    required
                >
            </div>

            <!-- Password -->
            <div class="f">
                <label for="p">Create password</label>
                <input
                    id="p"
                    type="password"
                    name="pw"
                    autocomplete="new-password"
                    placeholder="At least 8 characters"
                    required
                >
            </div>

            <!-- Confirm Password -->
            <div class="f">
                <label for="c">Confirm password</label>
                <input
                    id="c"
                    type="password"
                    name="pw2"
                    autocomplete="new-password"
                    placeholder="Re-enter password"
                    required
                >
            </div>

            <!-- Error Message -->
            <p class="err" role="alert"></p>

            <!-- Sign Up Button -->
            <button type="submit">Sign up</button>

            <!-- Google Sign Up Button -->
            <button type="button" class="g" data-go="google">

                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.5l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/>
                    <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
                    <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
                </svg>

                Sign up with Google
            </button>

            <!-- Login Link -->
            <p class="sw">
                Already have an account?
                <a href="#" data-go="login" role="link">Log in</a>
            </p>

        </form>

        <!-- Branding Panel -->
        <div class="panel">
            <img class="logo" src="logo.png" alt="Avenza Logo">

            <h2>Start your journey with us!</h2>
        </div>

    </section>

    <!-- Notification Message -->
    <div class="ok" id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
    <script type="module" src="auth.js"></script>

</body>
</html>
