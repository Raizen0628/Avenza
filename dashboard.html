<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Avenza – Student</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <style>body { visibility: hidden; }</style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <img class="logo" src="logo.png" alt="Avenza">
      <nav id="nav"></nav>
    </aside>
    <main>
      <header class="top">
        <h1 class="page-title" id="ptitle">Home</h1>
        <button class="bell" id="bell" aria-label="Notifications">🔔<i id="dot" hidden></i></button>
        <div class="user-menu">
          <button type="button" class="user" id="userMenu" aria-haspopup="menu" aria-expanded="false">
            <span class="avatar">S</span><span class="uname">Hi, Student</span>
          </button>
          <div class="user-dropdown" id="userDropdown" role="menu" aria-label="User menu">
            <button type="button" role="menuitem" data-user-action="profile">Profile</button>
            <button type="button" role="menuitem" data-user-action="about">About</button>
            <button type="button" role="menuitem" class="logout-menu" data-user-action="logout">Log out</button>
          </div>
        </div>
      </header>
      <div id="view"><p class="spin">Loading…</p></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="guard.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
