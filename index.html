<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Avenza – Welcome</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Welcome / Splash Screen -->
    <section id="splash" class="splash on" aria-label="Avenza Welcome">

        <!-- FIRST SCREEN: full-screen slideshow -->
        <div class="screen">

            <!-- SLIDESHOW (dots are created automatically by script.js) -->
            <div class="stage">
                <div class="slider" id="slider" aria-roledescription="carousel" aria-label="Avenza pictures">

                    <figure class="slide active">
                        <img src="smlogo.jpg" alt="Picture 1">
                    </figure>
                    <figure class="slide">
                        <img src="smf1.png" alt="Picture 2">
                    </figure>
                    <figure class="slide">
                        <img src="smf2.png" alt="Picture 3">
                    </figure>
                    <figure class="slide">
                        <img src="smf3.png" alt="Picture 4">
                    </figure>
                    <figure class="slide">
                        <img src="smf4.png" alt="Picture 5">
                    </figure>
                    <figure class="slide">
                        <img src="smf5.png" alt="Picture 6">
                    </figure>
                    <figure class="slide">
                        <img src="smf6.png" alt="Picture 7">
                    </figure>

                    <div class="hero"><span>SM Foundation College Scholarship</span><h1>Apply, track and get selected, all in one place.</h1></div>
                    <button type="button" class="arrow prev" aria-label="Previous picture">&#8249;</button>
                    <button type="button" class="arrow next" aria-label="Next picture">&#8250;</button>

                    <div class="dots"></div>
                </div>
            </div>
        </div>

        <!-- BELOW: logo, tagline, buttons -->
        <div class="bottom">
            <img class="logo" src="logo.png" alt="Avenza Logo">
            <p class="tag">Your Future, Our Support</p>

            <div class="actions">
                <button type="button" data-go="signup">Get started</button>
                <button type="button" class="alt" data-go="login">Log in</button>
            </div>
        </div>
    </section>

    <!-- Notification / Toast -->
    <div class="ok" id="toast" role="status" aria-live="polite"></div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
